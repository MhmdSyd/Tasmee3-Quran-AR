name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu-latest runner already ships the Android SDK (ANDROID_HOME is set).
      # Make sure the exact platform and build-tools we need are present.
      - name: Ensure SDK platform and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch fonts and Mushaf data (not stored in git)
        run: bash scripts/fetch_assets.sh

      # Gradle 8.9 is installed here, so no committed wrapper jar is needed yet.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests and debug APK
        run: gradle --no-daemon test assembleDebug

      - name: APK size report
        run: |
          ls -l app/build/outputs/apk/debug/*.apk | awk '{printf "APK: %.1f MB  %s\n", $5/1048576, $9}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tasmee3-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
